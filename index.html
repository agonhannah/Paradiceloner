<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
      padding: 24px;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1;
      text-transform: uppercase;
    }

    .sub {
      margin: 16px 0 0;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="title">Coming Soon</h1>
    <p class="sub">Site update in progress.</p>
  </main>
</body>
</html>
